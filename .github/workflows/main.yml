name: Validate EV pipeline
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.5'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q
      - run: uv run --locked python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: validated-sample
          path: |
            artifacts/
            dbt/target/manifest.json
            dbt/target/run_results.json
