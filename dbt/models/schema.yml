version: 2
models:
  - name: enriched_electric_vehicles
    description: Typed source rows with explicit acceptance status. Missing coordinates do not exclude vehicles.
    columns:
      - name: quality_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [accepted, invalid_model_year, missing_make]
  - name: yearly_trend
    description: Accepted vehicle records grouped by model year; not a historical registration series.
    columns:
      - name: model_year
        tests: [not_null, unique]
      - name: vehicle_count
        tests: [not_null]
  - name: county_summary
    columns:
      - name: county
        tests: [not_null, unique]
