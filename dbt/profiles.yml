electric-vehicles:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('EV_DB_PATH', '../artifacts/ev.duckdb') }}"
      threads: 2
    s3:
      type: duckdb
      path: "{{ env_var('EV_DB_PATH', '../artifacts/ev.duckdb') }}"
      extensions: [httpfs, parquet]
      settings:
        s3_region: "{{ env_var('AWS_REGION', 'us-east-1') }}"
        s3_access_key_id: "{{ env_var('AWS_ACCESS_KEY_ID') }}"
        s3_secret_access_key: "{{ env_var('AWS_SECRET_ACCESS_KEY') }}"
